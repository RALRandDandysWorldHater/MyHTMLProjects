<!DOCTYPE html>

<head>

  <title>Protect Mametchi: Hostile Creature Sandbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #10121a;
      color: #eef1f8;
      display: flex;
      flex-direction: column;

      overflow: hidden;
      user-select: none;

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 8px 16px;
      border-bottom: 2px solid #2b3147;
      flex-wrap: wrap;
      gap: 8px;

    .title-area h1 { font-size: 16px; color: #ffd166; letter-spacing: 0.3px; }
    .stats { display: flex; gap: 10px; font-weight: bold; font-size: 13px; flex-wrap: wrap; }
    .stat-badge { background: #23283b; padding: 5px 10px; border-radius: 6px; border: 1px solid #363e59; }
    .infinity { color: #ffd166; font-size: 15px; }
    .top-controls { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      background: #3a86ff;
      color: #fff;
      border: none;
      padding: 6px 11px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: 0.12s;
    }
    button:hover { filter: brightness(1.12); }
    button.toggle-on { background: #06d6a0; color: #0e1a1d; }
    button.toggle-off { background: #4a526e; color: #d8deed; }
    button.warn { background: #f77f00; color: #fff; }
    button.danger { background: #ef476f; color: #fff; }

    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left GMod-Style Sandbox Spawnmenu */
    .spawnmenu {
      width: 370px;
      min-width: 330px;
      background: #171a26;
      border-right: 2px solid #2b3147;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
    }
    .spawnmenu-title {
      font-size: 13px;
      font-weight: bold;
      color: #06d6a0;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mode-bar {
      display: flex;
      gap: 5px;
      background: #212638;
      padding: 5px;
      border-radius: 7px;
      border: 1px solid #323952;
    }
    .mode-btn {
      flex: 1;
      padding: 5px 6px;
      font-size: 11px;
      background: #2c334a;
      color: #b8c1d9;
      border-radius: 5px;
    }
    .mode-btn.active {
      background: #ffd166;
      color: #12141d;
    }
    .search-box {
      width: 100%;
      background: #212638;
      border: 1px solid #363e59;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .search-box:focus { border-color: #3a86ff; }
    .tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .tab {
      background: #23283b;
      color: #b8c0d9;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #353d57;
    }
    .tab.active { background: #3a86ff; color: #fff; border-color: #3a86ff; }

    .spawn-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      padding-right: 3px;
      align-content: start;
    }
    .spawn-tile {
      background: #22273a;
      border: 2px solid #323954;
      border-radius: 8px;
      padding: 7px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.1s;
    }
    .spawn-tile:hover { border-color: #6f82bd; background: #282e45; }
    .spawn-tile.selected { border-color: #06d6a0; background: #1c3136; }
    .tile-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .tile-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #141722;
      border: 1px solid #3b4463;
      flex-shrink: 0;

    .tile-cat { font-size: 10px; color: #8fa0c7; }
    .tile-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #ffd166;
      border-top: 1px solid #313852;
      padding-top: 4px;
    }

      display: flex;
      flex-direction: column;
      background: #0d0f17;
      overflow: hidden;
    }

      border-bottom: 1px solid #2b3147;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;

      font-weight: bold;
      color: #ff758f;
      margin-right: 4px;

      padding: 4px 9px;

      border-radius: 5px;

    .canvas-wrap {

      align-items: center;

      padding: 10px;

      font-size: 11px;

    }
  </style>
</head>

function drawMiniIcon(canvasEl, c) {
  const ictx = canvasEl.getContext('2d');
  ictx.clearRect(0, 0, 28, 28);
  ictx.save();
  ictx.translate(14, 15);
  if (c.style === 'cxyz') {
    ictx.fillStyle = '#050505';
    ictx.beginPath();
    ictx.arc(-3, -6, 3.5, 0, Math.PI * 2);
    ictx.arc(3, -6, 3.5, 0, Math.PI * 2);
    ictx.ellipse(0, 1, 9, 6, 0, Math.PI, 0);
    ictx.lineTo(11, 4);
    ictx.lineTo(-9, 4);
    ictx.fill();
    ictx.fillStyle = '#ff1e1e';
    ictx.beginPath();
    ictx.arc(3, -1, 2, 0, Math.PI * 2);
    ictx.arc(6, 0, 1.8, 0, Math.PI * 2);
    ictx.fill();
  } else {
    ictx.fillStyle = c.color;
    ictx.beginPath();
    ictx.arc(0, 0, 9, 0, Math.PI * 2);
    ictx.fill();
    ictx.fillStyle = '#ffbe0b';
    ictx.beginPath();
    ictx.arc(3, -2, 2, 0, Math.PI * 2);
    ictx.fill();
  }
  ictx.restore();
}

function renderSpawnmenu() {
  tabsEl.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (activeCategory === cat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeCategory = cat; renderSpawnmenu(); };
    tabsEl.appendChild(btn);
  });

  gridEl.innerHTML = '';
  const filtered = CREATURES.filter(c => {
    const matchCat = activeCategory === 'All' || c.cat === activeCategory;
    const matchSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        c.cat.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCat && matchSearch;
  });

  filtered.forEach(c => {
    const tile = document.createElement('div');
    tile.className = 'spawn-tile' + (selectedCreature.id === c.id ? ' selected' : '');

    const top = document.createElement('div');
    top.className = 'tile-top';

    const icon = document.createElement('canvas');
    icon.width = 28;
    icon.height = 28;
    icon.className = 'tile-icon';
    drawMiniIcon(icon, c);

    const textWrap = document.createElement('div');
    textWrap.innerHTML = `
      <div class="tile-name">${c.name}</div>
      <div class="tile-cat">${c.cat}</div>
    `;

    top.appendChild(icon);
    top.appendChild(textWrap);

    const footer = document.createElement('div');
    footer.className = 'tile-footer';
    footer.innerHTML = `<span>Bite: ${c.dmg}</span><span>HP: ${c.hp}</span>`;

    tile.appendChild(top);
    tile.appendChild(footer);

    tile.onclick = () => {
      selectedCreature = c;
      updateHint();
      if (!gameOver) {
        if (spawnMode === 'spawn1') summonInLanes(c, 1);
        else if (spawnMode === 'spawn5') summonInLanes(c, 5);
      }
      renderSpawnmenu();
    };

    gridEl.appendChild(tile);
  });
}

function updateHint() {
  const modeLabel = spawnMode === 'spawn1'
    ? 'Clicking tile spawns 1'
    : spawnMode === 'spawn5'
    ? 'Clicking tile spawns 5'
    : 'Field Brush active (click/drag on field)';
  hintText.innerHTML = `Selected: <b>${selectedCreature.name}</b> • ${modeLabel} • Click anywhere on field to place`;
}

// Mode Buttons
document.getElementById('mode-spawn1').onclick = (e) => {
  spawnMode = 'spawn1';
  setActiveModeBtn(e.target);
  updateHint();
};
document.getElementById('mode-spawn5').onclick = (e) => {
  spawnMode = 'spawn5';
  setActiveModeBtn(e.target);
  updateHint();
};
document.getElementById('mode-brush').onclick = (e) => {
  spawnMode = 'brush';
  setActiveModeBtn(e.target);
  updateHint();
};

function setActiveModeBtn(activeEl) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  activeEl.classList.add('active');
}

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderSpawnmenu();
});

// Top Controls
const waveToggleBtn = document.getElementById('wave-toggle-btn');
waveToggleBtn.onclick = () => {
  autoWaves = !autoWaves;
  waveToggleBtn.textContent = autoWaves ? 'Auto-Waves: ON' : 'Auto-Waves: OFF';
  waveToggleBtn.className = autoWaves ? 'toggle-on' : 'toggle-off';
};

const pauseBtn = document.getElementById('pause-btn');
pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  pauseBtn.className = paused ? 'warn' : 'toggle-off';
};

document.getElementById('heal-btn').onclick = () => {
  mametchi.hp = mametchi.maxHp;
  gameOver = false;
  updateHud();
};

document.getElementById('clear-enemies-btn').onclick = () => {
  enemies = [];
  updateHud();
};

document.getElementById('clear-allies-btn').onclick = () => {
  allies = [];
  updateHud();
};

document.getElementById('restart-btn').onclick = () => {
  allies = [];
  enemies = [];
  biteEffects = [];
  mametchi.hp = mametchi.maxHp;
  wave = 1;
  enemiesToSpawn = 8;
  gameOver = false;
  paused = false;
  pauseBtn.textContent = 'Pause';
  pauseBtn.className = 'toggle-off';
  updateHud();
};

// Enemy Sandbox Spawner Buttons
document.querySelectorAll('.enemy-btn').forEach(btn => {
  btn.onclick = () => {
    if (gameOver) return;
    const typeName = btn.getAttribute('data-enemy');
    const template = ENEMY_TYPES.find(e => e.type === typeName);
    if (template) spawnSpecificEnemy(template);
  };
});

function summonInLanes(creatureTemplate, count) {
  const lanes = [215, 275, 335, 395, 455];
  for (let i = 0; i < count; i++) {
    const y = lanes[laneCycle % lanes.length];
    laneCycle++;
    const x = 165 + (i % 5) * 20;
    spawnAlly(creatureTemplate, x, y);
  }
}

function spawnAlly(creatureTemplate, x, y) {
  const clampedY = Math.max(195, Math.min(475, y));
  const clampedX = Math.max(130, Math.min(canvas.width - 35, x));
  allies.push({
    ...creatureTemplate,
    x: clampedX,
    y: clampedY,
    currentHp: creatureTemplate.hp,
    cdTimer: 0,
    biteAnim: 0
  });
  updateHud();
}

function spawnSpecificEnemy(template) {
  const scale = 1 + (wave - 1) * 0.12;
  const lanes = [215, 275, 335, 395, 455];
  const y = lanes[Math.floor(Math.random() * lanes.length)];
  enemies.push({
    ...template,
    x: canvas.width + 25,
    y: y,
    hp: Math.round(template.hp * scale),
    maxHp: Math.round(template.hp * scale),
    dmg: Math.round(template.dmg * scale),
    cdTimer: 0
  });
  updateHud();
}

function spawnWaveEnemy() {
  const template = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
  spawnSpecificEnemy(template);
}

// Canvas Click & Drag Placement
function placeAtMouseEvent(e) {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  spawnAlly(selectedCreature, cx, cy);
}

canvas.addEventListener('mousedown', (e) => {
  isDraggingCanvas = true;
  placeAtMouseEvent(e);
  lastBrushTime = performance.now();
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDraggingCanvas) return;
  const now = performance.now();
  if (now - lastBrushTime > 65) {
    placeAtMouseEvent(e);
    lastBrushTime = now;
  }
});

window.addEventListener('mouseup', () => { isDraggingCanvas = false; });

function updateHud() {
  document.getElementById('hp-display').textContent = `${mametchi.hp} / ${mametchi.maxHp}`;
  document.getElementById('wave-display').textContent = wave;
  document.getElementById('ally-count').textContent = allies.length;
  document.getElementById('enemy-count').textContent = enemies.length;
}

// Rendering
function drawBackground() {
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0, 0, canvas.width, 175);

  // Castle XYZ Towers
  ctx.fillStyle = '#6c757d';
  ctx.fillRect(28, 90, 95, 85);
  ctx.fillRect(23, 74, 22, 16);
  ctx.fillRect(65, 74, 22, 16);
  ctx.fillRect(106, 74, 22, 16);

  // Ground Line & Stone Floor
  ctx.fillStyle = '#111111';
  ctx.fillRect(0, 170, canvas.width, 8);
  ctx.fillStyle = '#7d8590';
  ctx.fillRect(0, 178, canvas.width, canvas.height - 178);

  // Lane Guides
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.13)';
  ctx.lineWidth = 2;
  for (let y = 215; y <= 455; y += 60) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawMametchi() {
  const { x, y } = mametchi;
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#fff3b0';
  ctx.beginPath();
  ctx.ellipse(0, 18, 22, 26, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0, -14, 26, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#1d3557';
  ctx.beginPath();
  ctx.arc(-18, -34, 11, 0, Math.PI * 2);
  ctx.arc(18, -34, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(-9, -15, 4, 0, Math.PI * 2);
  ctx.arc(9, -15, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff758f';
  ctx.beginPath();
  ctx.arc(-15, -9, 3.5, 0, Math.PI * 2);
  ctx.arc(15, -9, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MAMETCHI', 0, 58);
  ctx.restore();
}

function drawCreature(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  const lunge = c.biteAnim > 0 ? 8 : 0;
  ctx.translate(lunge, 0);

  if (c.style === 'cxyz') {
    // Castle XYZ Rat / Mouse: black body, long wavy tail, round ears, pointed snout, glowing red eyes
    ctx.strokeStyle = '#050505';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-c.size * 0.7, 2);
    ctx.bezierCurveTo(-c.size * 1.4, -14, -c.size * 1.7, 6, -c.size * 2.0, -10);
    ctx.stroke();

    ctx.fillStyle = '#050505';
    ctx.beginPath();
    ctx.arc(-4, -c.size * 0.75, c.size * 0.34, 0, Math.PI * 2);
    ctx.arc(6, -c.size * 0.78, c.size * 0.34, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0, 2, c.size * 0.95, c.size * 0.65, 0, Math.PI, 0);
    ctx.lineTo(c.size * 1.35, 6);
    ctx.quadraticCurveTo(c.size * 1.35, 11, c.size * 0.8, 11);
    ctx.lineTo(-c.size * 0.95, 11);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ff1e1e';
    ctx.beginPath();
    ctx.arc(c.size * 0.35, -3, 3.8, 0, Math.PI * 2);
    ctx.arc(c.size * 0.65, -2, 3.4, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(0, 0, c.size * 0.75, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = c.style === 'smiler' ? '#ffffff' : '#ffbe0b';
    ctx.beginPath();
    ctx.arc(c.size * 0.25, -4, 3, 0, Math.PI * 2);
    ctx.arc(c.size * 0.45, -4, 3, 0, Math.PI * 2);
    ctx.fill();

    // Biting Jaws
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(c.size * 0.45, 2);
    ctx.lineTo(c.size * 0.85, -2);
    ctx.lineTo(c.size * 0.65, 5);
    ctx.lineTo(c.size * 0.85, 9);
    ctx.lineTo(c.size * 0.45, 7);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(c.name, 0, -c.size - 6);
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  ctx.fillStyle = e.color;
  ctx.beginPath();
  ctx.roundRect(-e.size * 0.7, -e.size * 0.7, e.size * 1.4, e.size * 1.4, 6);
  ctx.fill();
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.stroke();

  if (e.type === 'King' || e.type === 'Female King') {
    ctx.fillStyle = e.type === 'King' ? '#ffd700' : '#ff9ebb';
    ctx.beginPath();
    ctx.moveTo(-12, -e.size * 0.7);
    ctx.lineTo(-14, -e.size * 0.7 - 12);
    ctx.lineTo(-5, -e.size * 0.7 - 5);
    ctx.lineTo(0, -e.size * 0.7 - 14);
    ctx.lineTo(5, -e.size * 0.7 - 5);
    ctx.lineTo(14, -e.size * 0.7 - 12);
    ctx.lineTo(12, -e.size * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(e.type, 0, 4);

  const hpPct = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = '#222';
  ctx.fillRect(-18, -e.size - 14, 36, 5);
  ctx.fillStyle = '#06d6a0';
  ctx.fillRect(-18, -e.size - 14, 36 * hpPct, 5);

  ctx.restore();
}

function drawBiteEffects() {
  biteEffects.forEach(b => {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = `rgba(255, 255, 255, ${b.life / 12})`;
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CHOMP! -' + b.dmg, 0, -10 - (12 - b.life));
    ctx.restore();
  });
}

function update() {
  if (gameOver || paused) return;

  if (autoWaves) {
    if (enemiesToSpawn > 0) {
      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnWaveEnemy();
        enemiesToSpawn--;
        spawnTimer = Math.max(35, 90 - wave * 5);
      }
    } else if (enemies.length === 0) {
      wave++;
      enemiesToSpawn = 8 + wave * 3;
      updateHud();
    }
  }

  // Hostile Creatures move toward enemies and BITE ONLY
  for (let i = allies.length - 1; i >= 0; i--) {
    const a = allies[i];
    if (a.cdTimer > 0) a.cdTimer--;
    if (a.biteAnim > 0) a.biteAnim--;

    let target = null;
    let bestDist = Infinity;
    for (const e of enemies) {
      const dist = Math.hypot(e.x - a.x, e.y - a.y);
      if (dist < bestDist) {
        bestDist = dist;
        target = e;
      }
    }

    if (target) {
      if (bestDist <= a.range) {
        if (a.cdTimer <= 0) {
          target.hp -= a.dmg;
          a.cdTimer = a.cooldown;
          a.biteAnim = 8;
          biteEffects.push({ x: target.x, y: target.y, dmg: a.dmg, life: 12 });
        }
      } else {
        const angle = Math.atan2(target.y - a.y, target.x - a.x);
        a.x += Math.cos(angle) * a.speed;
        a.y += Math.sin(angle) * a.speed;
      }
    }

    if (a.currentHp <= 0) {
      allies.splice(i, 1);
      updateHud();
    }
  }

  // Attacking Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) {
      enemies.splice(i, 1);
      updateHud();
      continue;
    }
    if (e.cdTimer > 0) e.cdTimer--;

    let blockedBy = null;
    for (const a of allies) {
      if (Math.hypot(e.x - a.x, e.y - a.y) < 34) {
        blockedBy = a;
        break;
      }
    }

    if (blockedBy) {
      if (e.cdTimer <= 0) {
        blockedBy.currentHp -= e.dmg;
        e.cdTimer = 40;
      }
    } else if (e.x > mametchi.x + 38) {
      e.x -= e.speed;
    } else {
      if (e.cdTimer <= 0) {
        mametchi.hp = Math.max(0, mametchi.hp - e.dmg);
        e.cdTimer = 45;
        updateHud();
        if (mametchi.hp <= 0) gameOver = true;
      }
    }
  }

  for (let i = biteEffects.length - 1; i >= 0; i--) {
    biteEffects[i].life--;
    if (biteEffects[i].life <= 0) biteEffects.splice(i, 1);
  }
}

function loop() {
  drawBackground();
  drawMametchi();
  allies.forEach(drawCreature);
  enemies.forEach(drawEnemy);
  drawBiteEffects();

  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SANDBOX PAUSED', canvas.width / 2, canvas.height / 2);
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4d6d';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MAMETCHI WAS DEFEATED!', canvas.width / 2, canvas.height / 2 - 12);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px sans-serif';
    ctx.fillText('Click "Heal Mametchi" or "Restart" above to keep playing', canvas.width / 2, canvas.height / 2 + 24);
  }

  update();
  requestAnimationFrame(loop);
}

renderSpawnmenu();
updateHint();
updateHud();
loop();
</script>
</body>
</html>
