<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protect Mametchi: Hostile Creature Defense</title>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #12141d;
      color: #f0f2f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
    }
    header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c2030;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid #2e344d;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .stats { display: flex; gap: 12px; font-weight: bold; font-size: 14px; flex-wrap: wrap; }
    .stat-badge { background: #262b40; padding: 6px 12px; border-radius: 6px; border: 1px solid #38405e; }
    .infinity { color: #ffd166; font-size: 16px; }
    .controls { display: flex; gap: 8px; }
    button {
      background: #3a86ff;
      color: white;
      border: none;
      padding: 7px 13px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }
    button:hover { background: #2667d4; }
    button.danger { background: #ef476f; }
    button.danger:hover { background: #c93256; }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1120px;
      border: 2px solid #2e344d;
      border-radius: 10px;
      overflow: hidden;
      background: #87ceeb;
    }
    canvas { display: block; width: 100%; height: 430px; cursor: crosshair; }
    .roster-panel {
      width: 100%;
      max-width: 1120px;
      background: #1c2030;
      border: 1px solid #2e344d;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      background: #262b40;
      color: #b8c0d9;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #38405e;
    }
    .tab.active { background: #ffd166; color: #12141d; border-color: #ffd166; }
    .helper-text { font-size: 12px; color: #9aa5c4; }
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .unit-card {
      background: #252a3d;
      border: 2px solid #353c57;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .unit-card.selected { border-color: #06d6a0; background: #1f3338; }
    .unit-name { font-weight: bold; font-size: 13px; color: #fff; }
    .unit-meta { font-size: 11px; color: #9aa5c4; }
    .summon-actions {
      display: flex;
      gap: 5px;
      margin-top: 2px;
    }
    .btn-summon {
      flex: 1;
      background: #06d6a0;
      color: #0d1b1e;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 5px;
    }
    .btn-summon:hover { background: #05b889; }
    .btn-summon-5 {
      background: #ffd166;
      color: #12141d;
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 5px;
    }
    .btn-summon-5:hover { background: #eab844; }
    .btn-select {
      background: #3a86ff;
      color: #fff;
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<header>
  <div class="stats">

    <div class="stat-badge">Mametchi HP: <span id="hp-display" style="color:#06d6a0;">1000 / 1000</span></div>
    <div class="stat-badge">Wave: <span id="wave-display">1</span></div>
    <div class="stat-badge">Active Creatures: <span id="count-display">0</span></div>
  </div>
  <div class="controls">
    <button class="danger" id="clear-btn">Clear All Creatures</button>
    <button id="restart-btn">Restart Game</button>
  </div>
</header>

<div id="game-container">

</div>

  <div class="unit-grid" id="unit-grid"></div>
</div>
