<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>My Doctor Appointment</h1>
<p>Fill in the form below to your book appointment.</p>
<hr>

<form>
<fieldset>
<legend>Personal Details</legend>

<label>Your Name</label><br>
<input type="text" id="name" placeholder="Enter your full name"><br><br>

<label>Patient ID</label>
<input type="password" id="pid" placeholder="Your Secret ID"><br><br>

<label>Date of birth</label><br>
<input type="date" id="dob">

</fieldset>

<fieldset>
<legend>Your Visit</legend>
<label>Choose Your Doctor</label><br>
<select id="doctor">
<option value="">-- Select a Doctor</option>
<option value="dr ray">Dr. Ray</option>
<option value="dr lee">Dr. Lee</option>
<option value="dr sam">Dr. Sam</option>
</select><br><br>

<label>Why are you visiting?</label>
<input type="radio" name="reason" value="fever"> Fever<br>
<input type="radio" name="reason" value="cold"> Cold<br>
<input type="radio" name="reason" value="checkup"> Checkup<br>
<input type="radio" name="reason" value="tooth"> Tooth Pain<br>

<label>Any notes for the doctor.</label><br>
<textarea id="notes" rows="3" cols="35" placeholder="e.g I have had a sore throat for 3 days."></textarea><br>



</select>
</fieldset>

<br>

<fieldset>
 <legend>Preferred Visit Day</legend>

 <input type="checkbox" value="mon"> Monday<br>
 <input type="checkbox" value="wed"> Wednesday<br>
 <input type="checkbox" value="fri"> Friday<br>

</fieldset>

<br>
<input type="sumbit" value="Book My Appointment">

</form>
    
</body>
</html>
